<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUAILeads Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-green': '#10b981',
              'slate-900': '#0f172a',
              'slate-800': '#1e293b',
              'slate-700': '#334155',
              'slate-600': '#475569',
              'slate-400': '#94a3b8',
              'slate-300': '#cbd5e1',
            },
          },
        },
      }
    </script>
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.81.0",
    "@vercel/node": "https://aistudiocdn.com/@vercel/node@^5.5.5"
  }
}
</script>
</head>
  <body class="bg-slate-900 text-slate-300">
    <div id="root"><p style="text-align: center; margin-top: 50px;">Loading configuration...</p></div>
    <script>
      (async () => {
        try {
          const response = await fetch('/api/config');
          if (!response.ok) {
            throw new Error(`Failed to fetch config: ${response.status} ${response.statusText}`);
          }
          const config = await response.json();

          if (!config.supabaseUrl || !config.supabaseAnonKey) {
            throw new Error('Received invalid configuration from server. Check Vercel environment variables.');
          }

          window.APP_CONFIG = {
            supabaseUrl: config.supabaseUrl,
            supabaseAnonKey: config.supabaseAnonKey
          };

          // Now load the main React app
          const script = document.createElement('script');
          script.type = 'module';
          script.src = '/index.tsx';
          document.body.appendChild(script);

        } catch (error) {
          console.error('Failed to initialize application:', error);
          document.getElementById('root').innerHTML = `<div style="text-align: center; margin-top: 50px; color: #f87171;">
            <h2>Application Error</h2>
            <p>Could not load necessary configuration from the server.</p>
            <p>Please check the console for details and ensure environment variables are set correctly in Vercel.</p>
          </div>`;
        }
      })();
    </script>
  </body>
</html>
